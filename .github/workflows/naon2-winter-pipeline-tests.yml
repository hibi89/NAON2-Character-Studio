name: NAON2 winter package safety tests
on:
  push:
    branches: [main]
    paths:
      - 'products/kmong-vol01/winter_release_pipeline.py'
      - 'products/kmong-vol01/verify_release_gate.py'
      - 'products/kmong-vol01/test_winter_release_pipeline.py'
      - '.github/workflows/naon2-winter-pipeline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-negative-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependency and Korean font
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Compile source
        run: |
          python -m py_compile products/kmong-vol01/winter_release_pipeline.py
          python -m py_compile products/kmong-vol01/verify_release_gate.py
          python -m py_compile products/kmong-vol01/test_winter_release_pipeline.py
      - name: Run 11 offline visual-package safety tests
        run: python -m unittest discover -s products/kmong-vol01 -p test_winter_release_pipeline.py -v
      - name: Verify release checker rejects missing buyer ZIPs
        shell: bash
        run: |
          if python products/kmong-vol01/verify_release_gate.py __MISSING_FULL__.zip __MISSING_WALL__.zip --json qa_negative.json; then
            echo 'Unexpected success: nonexistent buyer ZIPs'
            exit 1
          fi
          python - <<'PY'
          import json
          report=json.load(open('qa_negative.json',encoding='utf-8'))
          assert report['technical_pass'] is False
          assert report['release_eligible'] is False
          assert len(report['items'])==2
          print('Missing buyer assets correctly blocked')
          PY
