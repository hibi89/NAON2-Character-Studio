name: NAON2 two-menu ZIP verifier smoke test
on:
  push:
    branches: [main]
    paths:
      - 'products/kmong-vol01/verify_release_gate.py'
      - '.github/workflows/naon2-two-menu-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Syntax check
        run: python -m py_compile products/kmong-vol01/verify_release_gate.py
      - name: CLI smoke test
        run: python products/kmong-vol01/verify_release_gate.py --help
      - name: Negative case must refuse missing ZIPs
        shell: bash
        run: |
          if python products/kmong-vol01/verify_release_gate.py missing_full.zip missing_wallpaper.zip > qa_negative.json; then
            echo 'ERROR: missing packages incorrectly accepted'
            exit 1
          fi
          python - <<'PY'
          import json
          j=json.load(open('qa_negative.json',encoding='utf-8'))
          assert j['technical_pass'] is False
          assert j['release_eligible'] is False
          assert all(x['errors'] for x in j['items'])
          print('negative gate PASS')
          PY
